<!DOC
TYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen {
            text-align: center;
            width: 100%;
            padding: 25px;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 25px;
            font-weight: 400;
            margin-bottom: 15px;
        }

        #status {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .bar {
            width: 75%;
            max-width: 330px;
            height: 6px;
            background: #292929;
            border-radius: 10px;
            margin: auto;
            overflow: hidden;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: white;
            transition: width 0.5s ease;
        }

        #reveal {
            display: none;
            text-align: center;
        }

        #reveal h1 {
            font-size: 45px;
            font-weight: bold;
        }

        #reveal p {
            color: #aaa;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="screen" id="shutdown">
        <div class="logo">◉</div>

        <h1>Shutting down...</h1>

        <div id="status">Please wait</div>

        <div class="bar">
            <div id="progress"></div>
        </div>
    </div>

    <div id="reveal">
        <h1>😂 GOT YOU!</h1>
        <p>Your phone is completely fine.</p>
    </div>

    <script>
        let progress = 0;

        const messages = [
            "Preparing shutdown...",
            "Closing applications...",
            "Saving system data...",
            "Powering down...",
            "Almost done..."
        ];

        const timer = setInterval(() => {

            progress += Math.floor(Math.random() * 8) + 4;

            if (progress >= 100) {
                progress = 100;
                clearInterval(timer);

                setTimeout(() => {
                    document.getElementById("shutdown").style.display = "none";
                    document.getElementById("reveal").style.display = "block";
                }, 1200);
            }

            document.getElementById("progress").style.width =
                progress + "%";

            document.getElementById("status").textContent =
                messages[Math.floor(progress / 25)] || "Powering down...";

        }, 500);
      
    </script>

</body>
</html>
